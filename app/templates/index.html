<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit</title>
    <link rel="stylesheet" href="./static/styles.css"></link>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="//cdn.jsdelivr.net/npm/3d-force-graph"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body>
    <div id="loader"></div>
    <div class="window">
        <div id="sidebar"></div>
        <div class="searchbar">
            <div class="searchbar-inner">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="id" placeholder="Enter Steam ID (e.g. 76561198202745727)" autocomplete="off" spellcheck="false"/>
                <button id="submit-btn">Add</button>
                <button id="random-btn">Add Random</button>
            </div>
            <div class="hidden" id="instructions">
                <span class="instruction-item"><kbd>Left click</kbd>Expand friends</span>
                <span class="instruction-item"><kbd>Right click</kbd>View profile</span>
                <span class="instruction-item"><kbd>Left mouse drag</kbd> Rotate</span>
                <span class="instruction-item"><kbd>Scroll</kbd> Zoom</span>
                <span class="instruction-item"><kbd>Right mouse drag</kbd> Pan</span>
            </div>
        </div>
        <div id="graph"></div>
    </div>

    <script type="module" src="./static/index.js"></script>
</body>
</html>
