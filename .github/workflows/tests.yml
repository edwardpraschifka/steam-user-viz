name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # app/config.py raises an error if STEAM_API_KEY is missing, and the tests
    # pass USER_ID into get_friends(), which requires a 17-digit Steam ID.
    # Every Steam API call in the tests is mocked, so placeholders are enough
    # and no real key is needed.
    env:
      STEAM_API_KEY: placeholder-key-for-ci
      USER_ID: "76561197960265728"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
